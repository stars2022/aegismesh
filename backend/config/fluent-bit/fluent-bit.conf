[SERVICE]
    Flush           1
    Log_Level       info
    Parsers_File    /home/zcode/aegismesh/backend/config/fluent-bit/parsers.conf

# ── Heartbeat ──────────────────────────────────────────────
[INPUT]
    Name             tail
    Path             /home/zcode/aegismesh/logs/amp_heartbeat*.jsonl
    Tag              amp.heartbeat
    Parser           amp_audit_json
    Refresh_Interval 2
    Read_From_Head   True
    DB               /var/lib/aegismesh-fluentbit/heartbeat.db

[OUTPUT]
    Name                              kafka
    Match                             amp.heartbeat
    Brokers                           wt.ioa.pub:19092
    Topics                            amp.heartbeat
    Workers                           1
    rdkafka.log.connection.close      false
    rdkafka.request.required.acks     1
    rdkafka.allow.auto.create.topics  false

