[project]
name = "aegismesh"
version = "0.1.0"
description = "AIP-compatible quality-aware multi-agent collaboration runtime"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "sqlalchemy>=2.0.35",
  "uvicorn[standard]>=0.30.0",
  "acps-sdk @ git+https://github.com/AIP-PUB/ACPs-community.git@3985c1330209f075c124669cc9d31f0e75448140#subdirectory=acps-sdk",
  "acps-cli @ git+https://github.com/AIP-PUB/ACPs-community.git@3985c1330209f075c124669cc9d31f0e75448140#subdirectory=acps-cli",
  "cryptography>=43.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
